---
# defaults file for nomad

# You can install nomad using a package in this role. If you have installed
# nomad manually, set this to `false`.
nomad_install_package: true

# Common configuration
nomad_name: "{{ inventory_hostname_short }}"
nomad_region: global
nomad_datacenter: dc1

nomad_config_dir: /etc/nomad.d
nomad_data_dir: /opt/nomad/data
nomad_log_level: INFO

nomad_bind_addr: "0.0.0.0"
nomad_advertise_addr: "{{ ansible_facts['default_ipv4']['address'] }}"

# ACL settings
nomad_acl_enabled: false

# Vault integration settings
nomad_vault_enabled: false
nomad_vault_url: "http://vault.service.consul:8200"

# When set, Nomad authenticates against `auth/jwt-nomad-<name>/` instead of
# the default `auth/jwt-nomad/`. Use the Nomad cluster's name (e.g. "dev",
# "bidder") so each cluster has its own Vault mount and JWKS scope.
# Leave empty for single-cluster setups using the default path.
nomad_vault_name: ""

# Optional Nomad workload identity for Vault. When set, Nomad injects an
# identity block into every task's `vault` block automatically, so tasks
# exchange signed JWTs for Vault tokens via Vault's JWT auth method (no
# legacy nomad-server-token needed).
#
# Example:
#   nomad_vault_default_identity:
#     aud: ["vault"]
#     ttl: "1h"
#     env: true
#     file: false
#     change_mode: "restart"     # default; or "signal" + change_signal
#     change_signal: "SIGHUP"    # only used when change_mode = "signal"
#
# Leave as an empty map to keep the existing `vault {}` block unchanged.
nomad_vault_default_identity: {}

# Configuration for server nodes
nomad_server: false
nomad_server_bootstrap_expect: 1

# Configuration for client nodes
nomad_client: false
nomad_client_node_class: worker
nomad_client_host_volumes: []
nomad_client_host_networks: []
nomad_client_max_kill_timeout: 5m
nomad_docker_auth_enabled: false
nomad_docker_auth_file: /root/.docker/config.json

nomad_batch_scheduler_enabled: true
nomad_scheduler_enabled: true
nomad_service_scheduler_enabled: true
nomad_sysbatch_scheduler_enabled: true
