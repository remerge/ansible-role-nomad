---
# tasks file for nomad

- name: Import assert.yml
  ansible.builtin.import_tasks:
    file: assert.yml
  run_once: true
  delegate_to: localhost

- name: Install nomad
  ansible.builtin.package:
    name: nomad
    state: present
  when:
    - nomad_install_package

- name: Create nomad service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/nomad.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Override nomad.service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nomad.service.d/override.conf
    content: |
      {% if nomad_client %}
      [Unit]
      # Stop before Docker and Consul so the drain on shutdown can migrate
      # allocations and deregister their services.
      After=docker.service consul.service

      {% endif %}
      [Service]
      StandardOutput=null
      StandardError=null
      {% if nomad_client %}
      TimeoutStopSec={{ nomad_client_drain_deadline + 120 }}
      # drain_on_shutdown leaves the node ineligible. A client may undo its own
      # drain with its node secret, so no ACL token is needed. The leading "-"
      # keeps Nomad running if the servers are unreachable.
      ExecStartPost=-/bin/sh -c 'for i in $$(seq 30); do NOMAD_TOKEN=$$(cat {{ nomad_data_dir }}/client/secret-id) /usr/bin/nomad node drain -disable -yes $$(cat {{ nomad_data_dir }}/client/client-id) >/dev/null && exit 0; sleep 2; done; exit 1'
      {% endif %}
    mode: "0644"
  notify:
    - Restart nomad

- name: Create nomad_config_dir
  ansible.builtin.file:
    path: "{{ nomad_config_dir }}"
    state: directory
    owner: nomad
    group: nomad
    mode: "0750"

- name: Create nomad_data_dir
  ansible.builtin.file:
    path: "{{ nomad_data_dir }}"
    state: directory
    owner: nomad
    group: nomad
    mode: "0755"

- name: Configure nomad
  ansible.builtin.template:
    src: nomad.hcl.j2
    dest: "{{ nomad_config_dir }}/nomad.hcl"
    owner: nomad
    group: nomad
    mode: "0640"
  notify:
    - Restart nomad

- name: Configure nomad environment
  ansible.builtin.template:
    src: nomad.env.j2
    dest: "{{ nomad_config_dir }}/nomad.env"
    owner: nomad
    group: nomad
    mode: "0644"
  notify:
    - Restart nomad

- name: Delete server config if it is not defined
  ansible.builtin.file:
    path: "{{ nomad_config_dir }}/server.hcl"
    state: absent
  when:
    - not nomad_server
  notify:
    - Restart nomad

- name: Configure nomad server
  ansible.builtin.template:
    src: server.hcl.j2
    dest: "{{ nomad_config_dir }}/server.hcl"
    owner: nomad
    group: nomad
    mode: "0640"
  notify:
    - Restart nomad
  when:
    - nomad_server

- name: Delete client config if it is not defined
  ansible.builtin.file:
    path: "{{ nomad_config_dir }}/client.hcl"
    state: absent
  when:
    - not nomad_client
  notify:
    - Restart nomad

- name: Create docker dir
  ansible.builtin.file:
    path: "{{ nomad_docker_auth_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Store docker auth config
  ansible.builtin.copy:
    content: "{{ nomad_docker_auth_config }}"
    dest: "{{ nomad_docker_auth_file }}"
    owner: root
    group: root
    mode: "0640"
  when:
    - nomad_docker_auth_enabled

- name: Configure nomad client
  ansible.builtin.template:
    src: client.hcl.j2
    dest: "{{ nomad_config_dir }}/client.hcl"
    owner: nomad
    group: nomad
    mode: "0640"
  notify:
    - Restart nomad
  when:
    - nomad_client

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Start nomad
  ansible.builtin.service:
    name: nomad
    state: started
    enabled: true
